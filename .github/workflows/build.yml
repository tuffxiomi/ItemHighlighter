name: Build Item Highlighter

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip

      - name: Install Android NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "ndk;28.2.13676358"

      - name: Verify NDK Installation
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            echo "NDK installation failed"
            exit 1
          fi
          echo "NDK found at: $ANDROID_HOME/ndk/28.2.13676358"

      - name: Configure
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: cmake --build build --target item_highlighter levi_package --parallel

      - name: Verify Build Artifacts
        run: |
          echo "Checking for .so file..."
          if [ ! -f "build/libitem_highlighter.so" ]; then
            echo "libitem_highlighter.so not found"
            ls -la build/ || echo "build directory not found"
            exit 1
          fi
          echo ".so file found"
          
          echo "Checking for .levipack file..."
          if [ ! -f "build/item_highlighter-1.0.0-arm64-v8a.levipack" ]; then
            echo "item_highlighter-1.0.0-arm64-v8a.levipack not found"
            ls -la build/ || echo "build directory not found"
            exit 1
          fi
          echo ".levipack file found"

      - name: Upload .so
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ItemHighlighter-so
          path: build/libitem_highlighter.so

      - name: Upload .levipack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ItemHighlighter-levipack
          path: build/item_highlighter-1.0.0-arm64-v8a.levipack
